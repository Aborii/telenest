# ---------------------------------------------------------------------------
# PURPOSE
#   Dependabot configuration for telenest. Keeps dependencies patched by
#   opening grouped version-update PRs, complementing the repository-level
#   Dependabot *security* alerts/updates (which only fire on known CVEs).
#
# USAGE
#   Read automatically by GitHub Dependabot. PRs target `dev` (the integration
#   branch) per the project's branching model — never `main`.
#
# NOTE
#   `telegraf` and `telegram` (GramJS) are optional peer dependencies; updates
#   to them still surface here so the example/dev manifests stay current.
# ---------------------------------------------------------------------------
version: 2

updates:
  # ── npm dependencies ──────────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Feature/fix work integrates through `dev`, so version-update PRs do too.
    target-branch: 'dev'
    open-pull-requests-limit: 10
    labels:
      - 'area:infra'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    # Batch related updates into fewer PRs to cut review noise.
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'
        # `typescript` is kept OUT of this group deliberately.
        #
        # A grouped PR installs as one unit, so a single member that cannot
        # resolve takes the whole batch down with it. That happened: #136
        # carried 15 dev-dependency updates including a TypeScript 7 major,
        # while `@typescript-eslint` still declares a peer range of
        # `>=4.8.4 <6.1.0`. `npm install` died with ERESOLVE on both Node 20 and
        # 22, no rebase could help because the versions are genuinely
        # incompatible, and the other 14 updates stayed blocked behind it until
        # the PR was closed.
        #
        # Excluded rather than ignored, so TypeScript still gets its own PR: a
        # major the linter cannot take yet is then visible and red on its own
        # instead of holding a batch hostage. Drop this once
        # `@typescript-eslint` supports TypeScript 7.
        exclude-patterns:
          - 'typescript'

  # ── GitHub Actions used by the CI/CodeQL workflows ────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'dev'
    labels:
      - 'area:infra'
    commit-message:
      prefix: 'chore(ci)'
